services:
  nexvors3:
    build:
      context: .
      dockerfile: Dockerfile
    image: dinidun/nexvors3:latest
    container_name: nexvor-s3-server
    restart: unless-stopped
    ports:
      - "9000:9000"  # S3 API endpoint
      - "9001:9001"  # Web Console UI
    environment:
      - S3_PORT=9000
      - CONSOLE_PORT=9001
      - DATA_DIR=/data
      - NEXVOR_ROOT_USER=minioadmin     # Set your custom username / Access Key here
      - NEXVOR_ROOT_PASSWORD=minioadmin # Set your custom password / Secret Key here
      - ALLOW_ANON=true                 # Set to false in production to enforce strict AWS SigV4 (AWS4-HMAC-SHA256)
      - REPLICATION_TARGET_ENDPOINT=    # Optional: e.g. http://local-k3s-s3:9000 for native async cross-site replication
      - REPLICATION_ACCESS_KEY=
      - REPLICATION_SECRET_KEY=
    volumes:
      - nexvor_s3_data:/data

volumes:
  nexvor_s3_data:
    driver: local
